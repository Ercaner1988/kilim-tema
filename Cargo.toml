[package]
name = "kilim-tema"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ortak egui teması: Kilim paleti, Semerkant kâğıdı zemini, Yörük kilimi kenarlık, boncuk düğmeler"

[workspace]
members = [".", "isle", "tarama", "palet"]

[dependencies]
egui = "0.36"
kilim-palet = { path = "palet" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu"] }
eframe = { version = "0.36", features = ["wgpu"] }
