[package]
name = "kilim-cekirdek"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kilim egui temasının ortak çizim, rol ve tercih çekirdeği"

[dependencies]
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
kilim-palet = { path = "../palet" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
