[package]
name = "kilim-betik"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kilim teması için doğrulamalı, taşınabilir semantik arayüz betiği"

[dependencies]
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
kilim-cekirdek = { path = "../cekirdek" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
